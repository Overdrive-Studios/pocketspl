# Builds the PocketSPL software and publishes it to
# https://overdrive-studios.github.io/pocketspl/latest.json
# Meters find new versions there through the phone page.
#
# To release: change FW_VERSION in firmware/PocketSPL/PocketSPL.ino (and NOTES.txt), commit, push.
name: Build and publish firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", "web/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          exec > >(tee setup.log) 2>&1
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32 || { echo "::error::Couldn't install the ESP32 core"; exit 1; }
          arduino-cli lib install "Adafruit SSD1351 library" "Adafruit GFX Library" "Adafruit BusIO" || { echo "::error::Couldn't install the screen libraries"; exit 1; }

      # Partition layout only sets the size limit for the update file, so set it directly:
      #   8MB Feather: default_8MB  (3MB app x2, 1.5MB logs)
      #   4MB Feather: min_spiffs   (1.9MB app x2, 128KB logs)
      - name: Build for the 8MB Feather (ADA5323)
        run: |
          arduino-cli compile --fqbn esp32:esp32:adafruit_feather_esp32s3_nopsram \
            --build-property build.partitions=default_8MB \
            --build-property upload.maximum_size=3342336 \
            --output-dir out8 firmware/PocketSPL 2>&1 | tee build8.log || true
          test -f out8/PocketSPL.ino.bin || { echo "::error::8MB build failed"; grep -E "error|Error" build8.log | head -20 | sed 's/^/::error::/'; exit 1; }

      - name: Build for the 4MB / 2MB PSRAM Feather (ADA5477)
        run: |
          arduino-cli compile --fqbn esp32:esp32:adafruit_feather_esp32s3 \
            --build-property build.partitions=min_spiffs \
            --build-property upload.maximum_size=1966080 \
            --output-dir out4 firmware/PocketSPL 2>&1 | tee build4.log || true
          test -f out4/PocketSPL.ino.bin || { echo "::error::4MB build failed"; grep -E "error|Error" build4.log | head -20 | sed 's/^/::error::/'; exit 1; }

      - name: Make the update site
        run: |
          VER=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/PocketSPL/PocketSPL.ino)
          echo "Version $VER"
          mkdir -p site/fw
          cp out8/PocketSPL.ino.bin "site/fw/PocketSPL-$VER.bin"
          cp out4/PocketSPL.ino.bin "site/fw/PocketSPL-$VER-4mb.bin"
          grep -q "POCKETSPL-FW PS-1 $VER" "site/fw/PocketSPL-$VER.bin"
          grep -q "POCKETSPL-FLASH 8MB;" "site/fw/PocketSPL-$VER.bin"
          grep -q "POCKETSPL-FLASH 4MB;" "site/fw/PocketSPL-$VER-4mb.bin"
          NOTES=""
          [ -f firmware/NOTES.txt ] && NOTES=$(cat firmware/NOTES.txt)
          jq -n --arg v "$VER" --arg n "$NOTES" \
            --arg u "fw/PocketSPL-$VER.bin" --argjson s $(stat -c%s "site/fw/PocketSPL-$VER.bin") \
            --arg u4 "fw/PocketSPL-$VER-4mb.bin" --argjson s4 $(stat -c%s "site/fw/PocketSPL-$VER-4mb.bin") \
            '{version:$v, notes:$n, url:$u, size:$s, url_4mb:$u4, size_4mb:$s4}' > site/latest.json
          cat site/latest.json
          sed "s/__VERSION__/$VER/g" web/index.html > site/index.html          # the help page
          # USB repair (ESP Web Tools): whole-flash images, one per board
          for B in 8 4; do
            M=out$B/PocketSPL.ino.merged.bin
            if [ -f "$M" ]; then
              cp "$M" "site/fw/PocketSPL-$VER-${B}mb-full.bin"
              jq -n --arg v "$VER" --arg p "fw/PocketSPL-$VER-${B}mb-full.bin" \
                '{name:"PocketSPL", version:$v, new_install_prompt_erase:true, builds:[{chipFamily:"ESP32-S3", parts:[{path:$p, offset:0}]}]}' > "site/manifest-${B}mb.json"
            else
              echo "::warning::No merged image for the ${B}MB board, USB repair button won't work"
            fi
          done

      - name: Save the build log (only when something failed)
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build*.log setup.log /tmp/logs/ 2>/dev/null || true
          ls ~/.arduino15/packages/esp32/hardware/esp32/ > /tmp/logs/core.txt 2>&1 || true
          cd /tmp/logs && git init -q && git checkout -q -b build-logs
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "log ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-logs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Save the result to the build-logs branch
        run: |
          git clone -q --depth 1 --branch build-logs "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" logs 2>/dev/null || { mkdir logs; cd logs; git init -q; git checkout -q -b build-logs; cd ..; }
          cd logs
          printf 'run %s\nbuild %s\ndeploy %s\n' "$GITHUB_RUN_ID" "${{ needs.build.result }}" "${{ needs.deploy.result }}" > result.txt
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "result ${GITHUB_RUN_ID}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-logs
